<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/project-large.css">
    <title>Form Page</title>
    <meta name="description" content="The site provides information on how the club is organized, the activities such as weekly practices and competitions, also a form where they can join the club.">
    <script src="scripts/project.js" defer></script>

<body>
    <header>
        <div class="header-img">
        </div>
        <nav>
            <a href="project.html">Home</a></li>
            <a href="page-two.html">Competitions</a></li>
            <a href="form-project.html">Sign Up</a></li>
        </nav>
    </header>
    <main>
        <h1>Sign Up</h1>
        <form action="review.html" method="get">
            <label>Required Fields (*)</label>
            <label>Full Name:* <input type="text" name="name" id="full-name" required></label>
            <label>Email:* <input type="email" name="email" id="email" required></label>
            <label>Phone Number:* <input type="tel" name="phone" id="phone-number" required></label>
            <label>Date of Birth: (Optional) <input type="date" name="completeDate" id="completeDate"></label>

        </form>
    </main>
    <footer>
        <p>® <span id="currentyear"></span> - Wilford Luna Escobar - Peru</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
