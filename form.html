<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/form.css">
    <title>Product Review Form</title>
    <meta name="author" content="Wilford Luna">
    <meta name="description" content="In this page we will use a form to give comments and feedback about a product.">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <label>Date of Installation* <input type="date" name="completeDate" id="completeDate" required></label>
            <label><input type="checkbox" name="features" id="feature_durability" value="durability"> Durability</label>
            <label><input type="checkbox" name="features" id="feature_ease" value="ease of use"> Ease of Use</label>
            <label><input type="checkbox" name="features" id="feature_performance" value="performance"> Performance</label>
            <label><input type="checkbox" name="features" id="feature_" value=""> Design</label>
            <label>Written Review (Optional) <textarea name="comments" id="comments" rows="4" cols="50"></textarea></label>
            <label>Your name (Optional) <input type="text" name="name" id="name"></label>
        </form>

    </main>
    <footer>
        <p>® <span id="currentyear"></span> - Wilford Luna Escobar - Peru</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
